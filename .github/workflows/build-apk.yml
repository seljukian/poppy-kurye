name: Poppy Kurye APK Derle

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Kodlari Cek
        uses: actions/checkout@v4

      - name: Java 17 Kur
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle Kur
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-enabled: false

      - name: Gradle Sarmalayiciyi Olustur ve Derle
        run: |
          gradle wrapper
          chmod +x ./gradlew
          ./gradlew clean assembleDebug

      - name: Hazir APK Dosyasini Yukle
        uses: actions/upload-artifact@v4
        with:
          name: Poppy-Kurye-APK-v2
          path: app/build/outputs/apk/debug/app-debug.apk
