plugins {
    id 'com.android.application'
}

android {
    namespace 'com.poppy.courier'
    compileSdk 34

   defaultConfig {
    applicationId "com.poppy.courier"
    minSdk 24
    targetSdk 34
    versionCode 20      // Sayıyı direkt 20 yapın
    versionName "2.0"   // İsmi 2.0 yapın
}

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
